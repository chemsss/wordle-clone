<div [ngClass] = "{ 
                    cell: true, 
                    active: activeRow ? true : false, 
                    correct: activeRow && gridCell.status=='correct' ? true : false, 
                    'wrong-position': activeRow && gridCell.status=='wrong-position' ? true : false,
                    'not-present': activeRow && gridCell.status=='not-present' ? true : false,
                    example: gridCell.example ? true : false
                  }" >
  <p [ngClass] = "{ 
                    filled: gridCell.filled ? true : false,
                    empty: !gridCell.filled ? true : false
                  }">
    {{ activeRow ? gridCell.displayedLetter : "." }}
  </p>
</div>
